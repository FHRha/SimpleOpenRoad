server:
  host: 127.0.0.1
  port: 12345
  request_timeout_seconds: 30
  stream_timeout_seconds: 120

security:
  require_master_key: false
  require_admin_key: false
  mask_secrets_in_logs: true

routing:
  default_strategy: strict_priority
  retry:
    max_attempts_per_candidate: 2
    backoff_base_ms: 1
    backoff_max_ms: 10
    jitter_ms: 0
  error_policy:
    auth_invalid: switch_key
    auth_forbidden: switch_key
    rate_limit: retry_then_switch_key
    provider_unavailable: retry_then_switch_provider
    network_timeout: retry_then_switch_key
    malformed_response: switch_provider
    unsupported_model: switch_provider

providers:
  github:
    enabled: true
    priority: 20
    endpoint: https://example.invalid
    timeout_seconds: 10
    keys:
      - id: github-main
        key: test-key
        active: true
        priority: 100
        weight: 1
        tags: []
        limits:
          rpm: 60
        cooldown:
          rate_limit_seconds: 1
          error_seconds: 1
        max_retries: 1
        max_consecutive_errors: 5

routes:
  aliases:
    auto/fast:
      strategy: strict_priority
      candidates:
        - provider: github
          model: gpt-4.1-mini

storage:
  sqlite_path: data/test_gateway.db

health:
  check_interval_seconds: 3600
  startup_check: false
  check_timeout_seconds: 5

observability:
  json_logs: true
  request_log: true
  router_decision_log: true
  save_attempt_events: true
