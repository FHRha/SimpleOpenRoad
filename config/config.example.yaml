server:
  host: 0.0.0.0
  port: 12345
  request_timeout_seconds: 60
  stream_timeout_seconds: 300

security:
  require_master_key: true
  require_admin_key: true
  mask_secrets_in_logs: true

routing:
  default_strategy: strict_priority
  retry:
    max_attempts_per_candidate: 2
    backoff_base_ms: 200
    backoff_max_ms: 2000
    jitter_ms: 100
  error_policy:
    auth_invalid: switch_key
    auth_forbidden: switch_key
    rate_limit: retry_then_switch_key
    provider_unavailable: retry_then_switch_provider
    network_timeout: retry_then_switch_key
    malformed_response: switch_provider
    unsupported_model: switch_provider
  free_alias:
    max_candidates_per_request: 3
    stop_on_provider_free_tier_rate_limit: true
  model_quarantine:
    enabled: true
    failure_threshold: 3
    default_ttl_seconds: 1800
    error_ttl_seconds:
      rate_limit: 1800
      provider_unavailable: 600
      network_timeout: 300
      malformed_response: 21600
      unsupported_model: 86400
      unknown: 1800
    overrides: []

model_capabilities:
  tool_capable:
    - codex
    - coder
    - grok-code
    - customtools
    - kimi-k2.5
    - gpt-5.
    - gpt-4.1
    - gpt-4o
    - claude
    - qwen
  tool_disabled:
    - gemini-2.5-flash
    - gemini-3.1-flash-lite
    - gemini-3-flash
    - gemini-3.1-pro-preview
    - haiku
    - nano

inventory:
  refresh_time: "05:00"
  refresh_timezone: Europe/Moscow
  refresh_interval_hours: 24
  overrides: []

providers:
  gemini:
    enabled: true
    priority: 10
    endpoint: https://generativelanguage.googleapis.com
    timeout_seconds: 40
    keys: []

  github:
    enabled: true
    priority: 20
    endpoint: https://models.github.ai
    timeout_seconds: 45
    keys: []

  groq:
    enabled: true
    priority: 25
    endpoint: https://api.groq.com/openai/v1
    timeout_seconds: 45
    keys: []

  together:
    enabled: true
    priority: 27
    endpoint: https://api.together.xyz/v1
    timeout_seconds: 45
    keys: []

  cerebras:
    enabled: true
    priority: 28
    endpoint: https://api.cerebras.ai/v1
    timeout_seconds: 45
    keys: []

  cloudflare:
    enabled: true
    priority: 29
    endpoint: https://api.cloudflare.com/client/v4
    account_id: ""
    timeout_seconds: 45
    keys: []

  openrouter:
    enabled: true
    priority: 30
    endpoint: https://openrouter.ai/api/v1
    timeout_seconds: 45
    headers:
      HTTP-Referer: https://localhost
      X-Title: ai-gateway-router
    keys: []

routes:
  aliases: {}

storage:
  sqlite_path: data/gateway.db

health:
  check_interval_seconds: 300
  startup_check: true
  check_timeout_seconds: 20

observability:
  json_logs: true
  request_log: true
  router_decision_log: true
  save_attempt_events: true
