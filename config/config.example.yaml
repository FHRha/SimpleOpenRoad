server:
  host: 0.0.0.0
  port: 12345
  request_timeout_seconds: 60
  stream_timeout_seconds: 300

security:
  require_master_key: true
  require_admin_key: true
  mask_secrets_in_logs: true

routing:
  default_strategy: strict_priority
  retry:
    max_attempts_per_candidate: 2
    backoff_base_ms: 200
    backoff_max_ms: 2000
    jitter_ms: 100
  error_policy:
    auth_invalid: switch_key
    auth_forbidden: switch_key
    rate_limit: retry_then_switch_key
    provider_unavailable: retry_then_switch_provider
    network_timeout: retry_then_switch_key
    malformed_response: switch_provider
    unsupported_model: switch_provider

providers:
  gemini:
    enabled: true
    priority: 10
    endpoint: https://generativelanguage.googleapis.com
    timeout_seconds: 40
    keys:
      - id: gemini-main
        key: ${GEMINI_API_KEY_MAIN}
        active: true
        priority: 100
        weight: 1
        tags: [primary, fast]
        limits:
          rpm: 60
        cooldown:
          rate_limit_seconds: 30
          error_seconds: 15
        max_retries: 1
        max_consecutive_errors: 5

  github:
    enabled: true
    priority: 20
    endpoint: https://models.inference.ai.azure.com
    timeout_seconds: 45
    keys:
      - id: github-main
        key: ${GITHUB_MODELS_TOKEN}
        active: true
        priority: 90
        weight: 1
        tags: [fallback]
        limits:
          rpm: 60
        cooldown:
          rate_limit_seconds: 20
          error_seconds: 10
        max_retries: 1
        max_consecutive_errors: 5

  openrouter:
    enabled: true
    priority: 30
    endpoint: https://openrouter.ai/api/v1
    timeout_seconds: 45
    headers:
      HTTP-Referer: https://localhost
      X-Title: ai-gateway-router
    keys:
      - id: openrouter-main
        key: ${OPENROUTER_API_KEY}
        active: true
        priority: 80
        weight: 1
        tags: [fallback, broad]
        limits:
          rpm: 60
        cooldown:
          rate_limit_seconds: 20
          error_seconds: 10
        max_retries: 1
        max_consecutive_errors: 5

routes:
  aliases:
    auto/fast:
      strategy: strict_priority
      candidates:
        - provider: gemini
          model: gemini-2.5-flash
        - provider: github
          model: gpt-4.1-mini
        - provider: openrouter
          model: google/gemini-2.5-flash-preview

    auto/fallback:
      strategy: strict_priority
      candidates:
        - provider: github
          model: gpt-4.1-mini
        - provider: openrouter
          model: openai/gpt-4o-mini

storage:
  sqlite_path: data/gateway.db

health:
  check_interval_seconds: 300
  startup_check: true
  check_timeout_seconds: 20

observability:
  json_logs: true
  request_log: true
  router_decision_log: true
  save_attempt_events: true
