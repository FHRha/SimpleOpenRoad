server:
  host: 0.0.0.0
  port: 12345
  request_timeout_seconds: 60
  stream_timeout_seconds: 300

security:
  require_master_key: true
  require_admin_key: true
  mask_secrets_in_logs: true

routing:
  default_strategy: strict_priority
  retry:
    max_attempts_per_candidate: 2
    backoff_base_ms: 200
    backoff_max_ms: 2000
    jitter_ms: 100
  error_policy:
    auth_invalid: switch_key
    auth_forbidden: switch_key
    rate_limit: retry_then_switch_key
    provider_unavailable: retry_then_switch_provider
    network_timeout: retry_then_switch_key
    malformed_response: switch_provider
    unsupported_model: switch_provider
  free_alias:
    max_candidates_per_request: 3
    stop_on_provider_free_tier_rate_limit: true
  model_quarantine:
    enabled: true
    failure_threshold: 3
    default_ttl_seconds: 1800
    error_ttl_seconds:
      rate_limit: 1800
      provider_unavailable: 600
      network_timeout: 300
      malformed_response: 21600
      unsupported_model: 86400
      unknown: 1800
    overrides: []

model_capabilities:
  tool_capable:
    - codex
    - coder
    - grok-code
    - customtools
    - kimi-k2.5
    - gpt-5.
    - gpt-4.1
    - gpt-4o
    - claude
    - qwen
  tool_disabled:
    - gemini-2.5-flash
    - gemini-3.1-flash-lite
    - gemini-3-flash
    - gemini-3.1-pro-preview
    - haiku
    - nano

inventory:
  refresh_time: "05:00"
  refresh_timezone: Europe/Moscow
  refresh_interval_hours: 24
  overrides: []

providers:
  openai:
    enabled: true
    priority: 9
    endpoint: https://api.openai.com/v1
    timeout_seconds: 60
    keys: []

  anthropic:
    enabled: true
    priority: 11
    endpoint: https://api.anthropic.com/v1
    timeout_seconds: 120
    keys: []

  azure_openai:
    enabled: false
    priority: 12
    # Use your Azure resource endpoint. The adapter uses the requested model
    # name as the Azure deployment name and adds /openai/deployments/{model}.
    # You can also include a deployment template:
    # https://YOUR_RESOURCE.openai.azure.com/openai/deployments/{deployment}?api-version=2024-10-21
    endpoint: https://YOUR_RESOURCE.openai.azure.com?api-version=2024-10-21
    timeout_seconds: 120
    keys: []

  bedrock:
    enabled: false
    priority: 13
    # Amazon Bedrock OpenAI-compatible endpoint.
    # Replace region as needed and use an Amazon Bedrock API key as the key secret.
    endpoint: https://bedrock-runtime.us-west-2.amazonaws.com/openai/v1
    timeout_seconds: 120
    keys: []

  vertex_ai:
    enabled: false
    priority: 14
    # Vertex AI OpenAI-compatible endpoint.
    # Put one of the following into the key value:
    # - a Google Cloud access token
    # - an absolute path to a service account JSON file
    # - the literal value "adc" to use Application Default Credentials
    endpoint: https://aiplatform.googleapis.com/v1/projects/YOUR_PROJECT/locations/global/endpoints/openapi
    timeout_seconds: 120
    keys: []

