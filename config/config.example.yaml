server:
  host: 0.0.0.0
  port: 12345
  request_timeout_seconds: 60
  stream_timeout_seconds: 300

security:
  require_master_key: true
  require_admin_key: true
  mask_secrets_in_logs: true

routing:
  default_strategy: strict_priority
  retry:
    max_attempts_per_candidate: 2
    backoff_base_ms: 200
    backoff_max_ms: 2000
    jitter_ms: 100
  error_policy:
    auth_invalid: switch_key
    auth_forbidden: switch_key
    rate_limit: retry_then_switch_key
    provider_unavailable: retry_then_switch_provider
    network_timeout: retry_then_switch_key
    malformed_response: switch_provider
    unsupported_model: switch_provider

model_capabilities:
  tool_capable:
    - codex
    - coder
    - grok-code
    - customtools
    - kimi-k2.5
    - gpt-5.
    - gpt-4.1
    - gpt-4o
    - claude
    - qwen
  tool_disabled:
    - gemini-2.5-flash
    - gemini-3.1-flash-lite
    - gemini-3-flash
    - gemini-3.1-pro-preview
    - haiku
    - nano

providers:
  gemini:
    enabled: true
    priority: 10
    endpoint: https://generativelanguage.googleapis.com
    timeout_seconds: 40
    keys: []

  github:
    enabled: true
    priority: 20
    endpoint: https://models.github.ai
    timeout_seconds: 45
    keys: []

  openrouter:
    enabled: true
    priority: 30
    endpoint: https://openrouter.ai/api/v1
    timeout_seconds: 45
    headers:
      HTTP-Referer: https://localhost
      X-Title: ai-gateway-router
    keys: []

routes:
  aliases:
    auto/smart:
      strategy: strict_priority
      selection: adaptive
      candidates:
        - provider: gemini
          model: gemini-2.5-flash
        - provider: gemini
          model: gemini-3.1-flash-lite-preview
        - provider: gemini
          model: gemini-3-flash-preview
        - provider: gemini
          model: gemini-3.1-pro-preview
        - provider: github
          model: gpt-5.3-codex
        - provider: github
          model: gpt-5.4-mini
        - provider: github
          model: gpt-5.4
        - provider: github
          model: gpt-4.1-mini
        - provider: openrouter
          model: openai/gpt-5.4-nano
        - provider: openrouter
          model: openai/gpt-5.4-mini
        - provider: openrouter
          model: openai/gpt-5.4
        - provider: openrouter
          model: openai/gpt-5.4-pro
        - provider: openrouter
          model: openai/gpt-5.3-codex
        - provider: openrouter
          model: google/gemini-3.1-flash-lite-preview
        - provider: openrouter
          model: google/gemini-3-flash-preview
        - provider: openrouter
          model: google/gemini-3.1-pro-preview
        - provider: openrouter
          model: anthropic/claude-haiku-4.5
        - provider: openrouter
          model: anthropic/claude-sonnet-4.6
        - provider: openrouter
          model: anthropic/claude-opus-4.6
        - provider: openrouter
          model: qwen/qwen3-coder-plus
        - provider: openrouter
          model: qwen/qwen3-coder-next
        - provider: openrouter
          model: qwen/qwen3.6-plus
        - provider: openrouter
          model: moonshotai/kimi-k2.5
        - provider: openrouter
          model: x-ai/grok-code-fast-1
        - provider: openrouter
          model: x-ai/grok-4.20

    auto/fast:
      strategy: strict_priority
      candidates:
        - provider: gemini
          model: gemini-2.5-flash
        - provider: gemini
          model: gemini-3.1-flash-lite-preview
        - provider: github
          model: gpt-4.1-mini
        - provider: openrouter
          model: openai/gpt-5.4-nano
        - provider: openrouter
          model: google/gemini-3.1-flash-lite-preview
        - provider: openrouter
          model: anthropic/claude-haiku-4.5

    auto/balanced:
      strategy: strict_priority
      candidates:
        - provider: gemini
          model: gemini-3-flash-preview
        - provider: github
          model: gpt-5.4-mini
        - provider: github
          model: gpt-4.1
        - provider: openrouter
          model: openai/gpt-5.4-mini
        - provider: openrouter
          model: google/gemini-3-flash-preview
        - provider: openrouter
          model: anthropic/claude-sonnet-4.6
        - provider: openrouter
          model: qwen/qwen3.6-plus

    auto/strong:
      strategy: strict_priority
      candidates:
        - provider: gemini
          model: gemini-3.1-pro-preview
        - provider: github
          model: gpt-5.4-pro
        - provider: github
          model: gpt-5.4
        - provider: openrouter
          model: openai/gpt-5.4-pro
        - provider: openrouter
          model: openai/gpt-5.4
        - provider: openrouter
          model: google/gemini-3.1-pro-preview
        - provider: openrouter
          model: anthropic/claude-opus-4.6
        - provider: openrouter
          model: anthropic/claude-sonnet-4.6
        - provider: openrouter
          model: x-ai/grok-4.20

    auto/code:
      strategy: strict_priority
      candidates:
        - provider: github
          model: gpt-5.3-codex
        - provider: github
          model: gpt-5.4
        - provider: openrouter
          model: openai/gpt-5.3-codex
        - provider: openrouter
          model: anthropic/claude-sonnet-4.6
        - provider: openrouter
          model: anthropic/claude-opus-4.6
        - provider: openrouter
          model: openai/gpt-5.4
        - provider: openrouter
          model: google/gemini-3.1-pro-preview-customtools
        - provider: openrouter
          model: qwen/qwen3-coder-plus
        - provider: openrouter
          model: qwen/qwen3-coder-next
        - provider: openrouter
          model: moonshotai/kimi-k2.5
        - provider: openrouter
          model: x-ai/grok-code-fast-1
        - provider: gemini
          model: gemini-3.1-pro-preview

storage:
  sqlite_path: data/gateway.db

health:
  check_interval_seconds: 300
  startup_check: true
  check_timeout_seconds: 20

observability:
  json_logs: true
  request_log: true
  router_decision_log: true
  save_attempt_events: true
