[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-open-road"
version = "0.3.0"
description = "Self-hosted AI gateway/router with multi-provider failover"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "SimpleOpenRoad"}]
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "pydantic-settings>=2.4.0,<3.0.0",
  "PyYAML>=6.0.2,<7.0.0",
  "google-auth>=2.35.0,<3.0.0",
  "requests>=2.32.0,<3.0.0",
  "typer>=0.12.3,<1.0.0",
  "rich>=13.7.1,<14.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.23.8,<1.0.0",
  "respx>=0.21.1,<1.0.0",
  "ruff>=0.5.6,<1.0.0",
  "mypy>=1.11.0,<2.0.0"
]

[project.scripts]
sor = "app.cli.app:cli_app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.storage" = ["schema.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
